name: Python Insurance Claim
on: 
  push: 
    branches: 
      - main
  workflow_dispatch: 
jobs:
  test:
    name: Install Python and Test Python code
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Python
        run: echo $(python --version)
      - name: Install dependencies
        run: pip install -r  requirements-test.txt
      - name: List Packages
        run: pip list
      - name: Run Py Tests
        run: pytest tests/ -v 
      - name: Run test with coverage report
        run: |
          pytest tests/ -v \
            --cov==src \
            --cov-report='term-missing'
            --cov-fail-under=80
