name: 11 OIDC
on: 
  workflow_dispatch: 
permissions: 
  id-token: write
  contents: read
jobs:
  verify-awsa-auth:
    runs-on: ubuntu-latest
    steps:
      - name: configure aws credential via oidc
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{secrets.AWS_ROLE_ARN}}
          aws-region: us-east-1
      - name: confirm credentials expire on job completion
        run: |
          aws sts get-caller-identity --query 'Arn' --output text
          echo "credentials are temporary"
          
    
      
  
